<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nunu Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #7b5293;
            --card-bg: #fff;
            --accent-color: #ff9f43;
            --text-color: #222;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #8c61a5;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0,0,0,0.1);
        }
        .btn-top {
            background: #6c3483;
            color: #fff;
            border: 1px solid #d7bde2;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .called-number-display {
            background: #f39c12;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            padding: 5px 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .sub-header {
            padding: 5px 15px;
            font-size: 14px;
            color: #d7bde2;
            font-weight: bold;
        }
        .main-content {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .board-selector {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            max-height: 55vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
        }
        .board-num-btn {
            background: #e0d0ec;
            border: none;
            padding: 8px 0;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .board-num-btn.selected {
            background: #f39c12;
            color: white;
        }
        .bingo-card-container {
            background: #f4ecf7;
            color: #333;
            width: 100%;
            max-width: 350px;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            gap: 5px;
            margin-bottom: 5px;
        }
        .b-head {
            background: #d98880;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 4px;
        }
        .b-head:nth-child(2) { background: #27ae60; }
        .b-head:nth-child(3) { background: #2980b9; }
        .b-head:nth-child(4) { background: #c0392b; }
        .b-head:nth-child(5) { background: #8e44ad; }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
        }
        .bingo-cell {
            background: #fff;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .bingo-cell.marked {
            background-color: #f39c12;
            color: white;
            border-color: #e67e22;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #5b326f;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item {
            background: none;
            border: none;
            color: #d7bde2;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .nav-item.active {
            color: #fff;
            font-weight: bold;
        }
        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #f39c12;
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .action-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-top" onclick="resetToSelection()">Leave</button>
        <div id="called-box" class="called-number-display">-</div>
        <button class="btn-top" onclick="drawNumber()">Draw</button>
    </div>
    
    <div class="sub-header" id="sub-title">ካርቴላ ይምረጡ (Boards: 0/1)</div>

    <div class="main-content">
        <div class="board-selector" id="boardSelector"></div>

        <div class="bingo-card-container" id="cardContainer">
            <h3 style="margin: 0 0 10px 0; color: #5b326f;" id="card-title-lbl">Board Number 1</h3>
            <div class="bingo-header-row">
                <div class="b-head">B</div>
                <div class="b-head">I</div>
                <div class="b-head">N</div>
                <div class="b-head">G</div>
                <div class="b-head">O</div>
            </div>
            <div class="bingo-grid" id="bingoGrid"></div>
            <button class="action-btn" onclick="checkBingo()" style="background:#27ae60; margin-top:15px;">BINGO! ብል</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active"><span class="icon">🎮</span> Game</button>
        <button class="nav-item" onclick="alert('ታሪክ (History) በቅርቡ ይለቀቃል!')"><span class="icon">📜</span> History</button>
        <button class="nav-item" onclick="alert('የኪስ ቦርሳ (Wallet): 0 ብር')"><span class="icon">👛</span> Wallet</button>
        <button class="nav-item" onclick="alert('ተጠቃሚ: ' + userName)"><span class="icon">👤</span> Profile</button>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2 style="margin-top:0;">BINGO!</h2>
            <p id="winner-text" style="font-size: 18px; font-weight: bold;">ተሸልመዋል!</p>
            <button class="action-btn" style="background:#fff; color:#f39c12;" onclick="closeModal()">እሺ</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let userName = "Nunu"; // ስሙ ኑኑ ተብሎ ተስተካክሏል

        let currentCalledNumber = "-";
        let drawnHistory = [];
        let selectedBoardId = null;
        let currentBoardNumbers = [];

        const selector = document.getElementById("boardSelector");
        for(let i = 1; i <= 400; i++) {
            let btn = document.createElement("button");
            btn.classList.add("board-num-btn");
            btn.innerText = i;
            btn.onclick = () => selectBoard(i);
            selector.appendChild(btn);
        }

        function playSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function selectBoard(id) {
            selectedBoardId = id;
            document.getElementById("boardSelector").style.display = "none";
            document.getElementById("cardContainer").style.display = "flex";
            document.getElementById("sub-title").innerText = `ተጫዋች: ${userName} (Board #${id})`;
            document.getElementById("card-title-lbl").innerText = `Board Number ${id}`;
            
            currentBoardNumbers = generateCardNumbers(id);
            renderBingoCard();
        }

        function resetToSelection() {
            document.getElementById("boardSelector").style.display = "grid";
            document.getElementById("cardContainer").style.display = "none";
            document.getElementById("sub-title").innerText = "ካርቴላ ይምረጡ (Boards: 0/1)";
        }

        function generateCardNumbers(seed) {
            let numbers = [];
            let rGen = seedRandom(seed);
            while(numbers.length < 25) {
                let num = Math.floor(rGen() * 75) + 1;
                if(!numbers.includes(num)) numbers.push(num);
            }
            return numbers;
        }

        function seedRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return function() {
                x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            };
        }

        function renderBingoCard() {
            let grid = document.getElementById("bingoGrid");
            grid.innerHTML = "";
            currentBoardNumbers.forEach((num, idx) => {
                let cell = document.createElement("div");
                cell.classList.add("bingo-cell");
                cell.innerText = num;

                if(idx === 12) {
                    cell.innerText = "*";
                    cell.classList.add("marked");
                }

                cell.onclick = () => {
                    if(idx !== 12) {
                        cell.classList.toggle("marked");
                    }
                };
                grid.appendChild(cell);
            });
        }

        function drawNumber() {
            if(drawnHistory.length >= 75) {
                alert("ሁሉም ቁጥሮች አልቀዋል!");
                return;
            }
            let num;
            do {
                num = Math.floor(Math.random() * 75) + 1;
            } while(drawnHistory.includes(num));

            drawnHistory.push(num);
            currentCalledNumber = num;
            document.getElementById("called-box").innerText = num;
            playSound();

            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
        }

        function checkBingo() {
            let cells = document.querySelectorAll(".bingo-cell");
            let markedCount = 0;
            let isValid = true;

            cells.forEach((cell, idx) => {
                if(idx !== 12 && cell.classList.contains("marked")) {
                    let n = parseInt(cell.innerText);
                    if(!drawnHistory.includes(n)) {
                        isValid = false;
                    } else {
                        markedCount++;
                    }
                }
            });

            if(markedCount >= 4 || isValid) {
                document.getElementById("winner-text").innerText = `${userName} has won the game!`;
                document.getElementById("winModal").style.display = "flex";
            } else {
                alert("⚠️ የተመረጡት አንዳንድ ቁጥሮች ገና አልወጡም! እባክዎ በትክክል ያረጋግጡ።");
            }
        }

        function closeModal() {
            document.getElementById("winModal").style.display = "none";
        }
    </script>
</body>
</html>
