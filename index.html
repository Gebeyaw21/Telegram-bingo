<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afro Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #dcd0ec;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #6c3483, #4a235a);
            color: #fff;
            margin: 15px;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .welcome-banner h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }
        .welcome-banner p {
            margin: 5px 0 0 0;
            font-size: 26px;
            font-weight: 700;
        }
        .boards-badge-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .boards-badge {
            background: #6c3483;
            color: white;
            padding: 6px 18px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stake-card {
            background: #f4ecf7;
            border: 2px solid #a569bd;
            margin: 0 15px 15px 15px;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stake-title {
            color: #4a235a;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .stake-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 340px;
            background: #45b39d;
            border-radius: 35px;
            padding: 6px 8px 6px 20px;
            margin-bottom: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .stake-row.orange {
            background: #eb984e;
        }
        .stake-btn-action {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .stake-amount {
            color: white;
            font-size: 28px;
            font-weight: 800;
            padding-right: 20px;
        }
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4ecf7;
            padding: 10px 12px;
            border-bottom: 2px solid #d7bde2;
        }
        .top-btn {
            background: #6c3483;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .top-box {
            background: white;
            color: #333;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            min-width: 45px;
        }
        .top-box.highlight {
            background: #f39c12;
            color: white;
            font-size: 22px;
            border: none;
        }
        .board-selection-area {
            flex: 1;
            padding: 10px 15px;
            overflow-y: auto;
            display: none;
        }
        .board-header-info {
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .boards-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            background: #f4ecf7;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #a569bd;
        }
        .b-num-btn {
            background: #bdc3c7;
            border: none;
            aspect-ratio: 1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: #2c3e50;
        }
        .b-num-btn.selected {
            background: #e67e22;
            color: white;
        }
        .start-game-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            display: none;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #4a235a;
            padding: 8px 0;
            margin-top: auto;
        }
        .nav-item {
            background: none;
            border: none;
            color: #d7bde2;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .nav-item.active {
            color: #fff;
            background: #6c3483;
            padding: 6px 15px;
            border-radius: 12px;
            font-weight: bold;
        }
        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #f4ecf7;
            width: 85%;
            max-width: 340px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .modal-header-bg {
            background: #e67e22;
            color: white;
            padding: 20px;
        }
        .modal-header-bg h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
        }
        .winner-badge {
            background: #27ae60;
            color: white;
            display: inline-block;
            padding: 6px 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }
        .winning-card-preview {
            padding: 15px;
        }
    </style>
</head>
<body>

    <!-- መነሻ ገጽ -->
    <div id="homeView" style="display: flex; flex-direction: column; flex: 1;">
        <div class="welcome-banner">
            <h1>Welcome</h1>
            <p>to</p>
            <h1>Afro Bingo</h1>
        </div>

        <div class="boards-badge-container">
            <div class="boards-badge" id="selectedBadgeCount">🎟️ 0 ቦርዶች ተመርጠዋል</div>
        </div>

        <div class="stake-card">
            <div class="stake-title">Choose Your Stake</div>
            
            <div class="stake-row">
                <button class="stake-btn-action" onclick="goToBoardSelection(10)">Play</button>
                <div class="stake-amount">10</div>
            </div>

            <div class="stake-row orange">
                <button class="stake-btn-action" onclick="goToBoardSelection(20)">Play</button>
                <div class="stake-amount">20</div>
            </div>
        </div>
    </div>

    <!-- የቦርድ መምረጫ / ጨዋታ ገጽ -->
    <div id="gameView" class="board-selection-area">
        <div class="game-top-bar" style="margin: -10px -15px 10px -15px; border-radius: 0;">
            <button class="top-btn" onclick="backToHome()">Leave</button>
            <div class="top-box highlight" id="calledNumDisplay">-</div>
            <div class="top-box" id="walletDisplay">Wallet 0</div>
            <div class="top-box" id="stakeDisplay">Stake 10</div>
            <button class="top-btn" onclick="triggerRefresh()">Refresh</button>
        </div>

        <div class="board-header-info">
            <span id="boardsCountLabel">Boards: 0/2</span>
            <span style="font-size: 12px; color: #6c3483;">ከ 1 እስከ 2 ካርቴላ ይምረጡ</span>
        </div>

        <div class="boards-grid" id="boardsGridContainer"></div>

        <button class="start-game-btn" id="startGameBtn" onclick="startTheGame()">ጨዋታውን ጀምር</button>
    </div>

    <!-- የታችኛው ሜኑ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('game')"><span class="icon">🎮</span> Game</button>
        <button class="nav-item" onclick="switchTab('history')"><span class="icon">📜</span> History</button>
        <button class="nav-item" onclick="switchTab('wallet')"><span class="icon">👛</span> Wallet</button>
        <button class="nav-item" onclick="switchTab('profile')"><span class="icon">👤</span> Profile</button>
    </div>

    <!-- የድል ማሳወቂያ ሞዳል -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <div class="modal-header-bg">
                <h2>BINGO!</h2>
                <div class="winner-badge" id="winnerNameDisplay">ተጫዋች አሸንፏል!</div>
            </div>
            <div class="winning-card-preview">
                <p style="margin: 10px 0; font-weight: bold; color: #4a235a;">መስመር ተዘግቷል!</p>
                <button class="top-btn" style="width: 100%; background: #e67e22; padding: 12px; font-size: 16px;" onclick="closeModal()">ቀጥል</button>
            </div>
        </div>
    </div>

    <script>
        let currentStake = 10;
        let selectedBoards = [];
        let autoCallTimer = null;

        // ከ 1 እስከ 90 ያሉትን የቦርድ ቁጥሮች መፍጠር
        const gridContainer = document.getElementById("boardsGridContainer");
        for(let i = 1; i <= 90; i++) {
            let btn = document.createElement("button");
            btn.classList.add("b-num-btn");
            btn.innerText = i;
            btn.id = `board-btn-${i}`;
            btn.onclick = () => toggleBoardSelection(i);
            gridContainer.appendChild(btn);
        }

        function goToBoardSelection(amount) {
            currentStake = amount;
            document.getElementById("homeView").style.display = "none";
            document.getElementById("gameView").style.display = "block";
            document.getElementById("stakeDisplay").innerText = `Stake ${amount}`;
            selectedBoards = [];
            updateBoardSelectionUI();
        }

        // እስከ 2 ካርቴላዎች ብቻ መምረጥ የሚቻልበት አሰራር
        function toggleBoardSelection(id) {
            let index = selectedBoards.indexOf(id);
            if(index > -1) {
                selectedBoards.splice(index, 1);
            } else {
                if(selectedBoards.length >= 2) {
                    alert("⚠️ ቢበዛ መምረጥ የሚችሉት 2 ካርቴላዎች ብቻ ናቸው!");
                    return;
                }
                selectedBoards.push(id);
            }
            updateBoardSelectionUI();
        }

        function updateBoardSelectionUI() {
            for(let i = 1; i <= 90; i++) {
                let btn = document.getElementById(`board-btn-${i}`);
                if(selectedBoards.includes(i)) {
                    btn.classList.add("selected");
                } else {
                    btn.classList.remove("selected");
                }
            }
            document.getElementById("boardsCountLabel").innerText = `Boards: ${selectedBoards.length}/2`;
            document.getElementById("selectedBadgeCount").innerText = `🎟️ ${selectedBoards.length} ቦርዶች ተመርጠዋል`;
            
            let startBtn = document.getElementById("startGameBtn");
            if(selectedBoards.length > 0) {
                startBtn.style.display = "block";
            } else {
                startBtn.style.display = "none";
            }
        }

        // የአማርኛ ድምፅ ማቀናበሪያ (Text-to-Speech in Amharic)
        function speakAmharic(text) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'am-ET'; // የአማርኛ ኮድ
                utterance.rate = 0.9; // የንግግር ፍጥነት
                window.speechSynthesis.speak(utterance);
            }
        }

        function startTheGame() {
            document.getElementById("boardsGridContainer").style.display = "none";
            document.getElementById("startGameBtn").style.display = "none";
            document.querySelector('.board-header-info').innerHTML = `<span style="color:#27ae60; font-weight:bold;">ጨዋታው ተጀምሯል! የተመረጡ ቦርዶች: ${selectedBoards.join(', ')}</span>`;
            
            // በየሰከንዱ (በየ 3 ሰከንድ) ቁጥሮችን በአማርኛ መጥራት
            let calledNumbers = [];
            if(autoCallTimer) clearInterval(autoCallTimer);

            autoCallTimer = setInterval(() => {
                if(calledNumbers.length >= 90) {
                    clearInterval(autoCallTimer);
                    return;
                }
                let num;
                do {
                    num = Math.floor(Math.random() * 90) + 1;
                } while(calledNumbers.includes(num));

                calledNumbers.push(num);
                document.getElementById("calledNumDisplay").innerText = num;

                // ቁጥሩን በአማርኛ ድምፅ ማስተላለፍ
                speakAmharic(`ቁጥር ${num}`);

                // በዘፈቀደ ድል የማምጣት ሁኔታ (ለሙከራ)
                if(calledNumbers.length === 6) {
                    clearInterval(autoCallTimer);
                    document.getElementById("winnerNameDisplay").innerText = `ቦርድ #${selectedBoards[0]} አሸንፏል!`;
                    document.getElementById("winModal").style.display = "flex";
                    speakAmharic("ቢንጎ! አሸናፊ ተገኝቷል!");
                }
            }, 3000);
        }

        function backToHome() {
            if(autoCallTimer) clearInterval(autoCallTimer);
            window.speechSynthesis.cancel();
            document.getElementById("gameView").style.display = "none";
            document.getElementById("homeView").style.display = "flex";
            document.getElementById("boardsGridContainer").style.display = "grid";
            document.getElementById("winning-card-preview").style.display = "block";
        }

        function closeModal() {
            document.getElementById("winModal").style.display = "none";
            backToHome();
        }

        function triggerRefresh() {
            alert("ቦርዶች ታድሰዋል!");
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if(tab === 'wallet') {
                alert("የኪስ ቦርሳ ገጽ");
            } else if(tab === 'history') {
                alert("የታሪክ ገጽ");
            } else if(tab === 'profile') {
                alert("የመገለጫ ገጽ");
            }
        }
    </script>
</body>
</html>
