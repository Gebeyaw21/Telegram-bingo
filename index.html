<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afro Bingo Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6c3483;
            --primary-dark: #4a235a;
            --accent: #f39c12;
            --success: #27ae60;
            --bg-light: #f4ecf7;
            --border-color: #a569bd;
            --b-color: #f1c40f;
            --i-color: #e67e22;
            --n-color: #3498db;
            --g-color: #e74c3c;
            --o-color: #e67e22;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #dcd0ec;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .app-view {
            flex: 1;
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        /* Registration View */
        .reg-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            height: 100%;
            text-align: center;
        }
        .reg-box {
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .reg-box h2 {
            color: var(--primary-dark);
            margin-top: 0;
            font-size: 22px;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            text-align: center;
        }
        .share-contact-btn {
            background: #2481cc;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* Game Layout (Side-by-Side as requested) */
        .game-header-top {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
            background: var(--primary-dark);
            font-size: 11px;
            text-align: center;
            color: white;
            font-weight: bold;
        }
        .top-badge {
            background: var(--bg-light);
            color: var(--primary-dark);
            padding: 4px 2px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-badge span {
            font-size: 10px;
            color: #666;
        }
        .top-badge b {
            font-size: 12px;
            color: var(--primary-dark);
        }

        .game-main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 6px;
            gap: 6px;
        }

        /* Left side: 75 Numbers Grid Board */
        .board-sidebar {
            width: 42%;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .b-columns-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }
        .col-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .col-header {
            background: var(--primary);
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 0;
            border-radius: 3px;
        }
        .num-cell {
            background: #e0d0ec;
            border: none;
            aspect-ratio: 1;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Color highlights matching reference photo style */
        .num-cell.called-b { background: var(--b-color); color: #fff; font-weight: 900; }
        .num-cell.called-i { background: var(--i-color); color: #fff; font-weight: 900; }
        .num-cell.called-n { background: var(--n-color); color: #fff; font-weight: 900; }
        .num-cell.called-g { background: var(--g-color); color: #fff; font-weight: 900; }
        .num-cell.called-o { background: var(--o-color); color: #fff; font-weight: 900; }

        /* Right side: Current Call & Display Area */
        .game-right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .current-call-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 14px;
            padding: 10px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        .current-call-text {
            font-size: 16px;
            font-weight: bold;
        }
        .current-call-circle {
            background: var(--accent);
            color: white;
            font-size: 24px;
            font-weight: 900;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid #fff;
        }

        .recent-calls-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            background: var(--bg-light);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .recent-ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ccc;
            color: #333;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #fff;
        }

        .message-board-box {
            flex: 1;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .message-board-box p {
            color: var(--primary-dark);
            font-weight: bold;
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        /* Bottom Controls Bar */
        .bottom-action-bar {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: #4a235a;
        }
        .footer-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            text-align: center;
        }
        .btn-leave { background: #c0392b; }
        .btn-refresh { background: #2980b9; }
        .btn-auto { background: var(--success); }

        /* Modal popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-light);
            width: 85%;
            max-width: 320px;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- 1. ምዝገባ እና ኮንታክት ማጋራት ገጽ (Registration / Contact Share View) -->
    <div id="regView" class="app-view" style="display: flex;">
        <div class="reg-container">
            <div class="reg-box">
                <h2>Afro Bingo መጫወቻ</h2>
                <p style="font-size: 13px; color: #555; margin-bottom: 15px;">ለመጀመር ስልክ ቁጥርዎን ያስገቡ ወይም ቴሌግራም ኮንታክትዎን ያጋሩ።</p>
                
                <button class="share-contact-btn" onclick="shareTelegramContact()">
                    <span>📎</span> Contact አጋራ (Share Contact)
                </button>

                <div style="margin: 12px 0; font-size: 12px; color: #777;">ወይም በስልክ ቁጥር ይመዝገቡ</div>

                <input type="tel" class="form-input" id="userPhoneInput" placeholder="ስልክ ቁጥር (ምሳሌ፡ 0912345678)">
                <button class="submit-btn" onclick="completeRegistration()">ግባ ወደ ጨዋታው (Join)</button>
            </div>
        </div>
    </div>

    <!-- 2. ዋናው የቢንጎ መጫወቻ ገጽ (Main Game View) -->
    <div id="gameView" class="app-view">
        <!-- Top Status Bar (Game ID, Derash, Players, Stake, Called) -->
        <div class="game-header-top">
            <div class="top-badge"><span>Game ID</span><b id="lblGameId">C69U4KY</b></div>
            <div class="top-badge"><span>Derash</span><b id="lblDerash">912</b></div>
            <div class="top-badge"><span>Players</span><b id="lblPlayers">114</b></div>
            <div class="top-badge"><span>Stake</span><b id="lblStake">10</b></div>
            <div class="top-badge"><span>Called</span><b id="lblCalledCount">0</b></div>
        </div>

        <!-- Main Layout: Left Board Grid & Right Controls/Display -->
        <div class="game-main-layout">
            <!-- Left Side: 75 Numbers Table Sidebar -->
            <div class="board-sidebar">
                <div class="b-columns-container" id="bColumnsContainer">
                    <!-- JavaScript will generate columns B, I, N, G, O here -->
                </div>
            </div>

            <!-- Right Side: Current Call & Active Message Box -->
            <div class="game-right-panel">
                <div class="current-call-card">
                    <div class="current-call-text">Current Call</div>
                    <div class="current-call-circle" id="currentCallCircle">-</div>
                </div>

                <div class="recent-calls-row" id="recentCallsRow">
                    <div class="recent-ball">-</div>
                    <div class="recent-ball">-</div>
                    <div class="recent-ball">-</div>
                </div>

                <div class="message-board-box">
                    <p id="gameStatusText">እግዚአብሔር ይህን ጨዋታ እስከሚጨርስ ድረስ ይጠብቁ</p>
                </div>
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="bottom-action-bar">
            <button class="footer-btn btn-leave" onclick="leaveGame()">← Leave</button>
            <button class="footer-btn btn-refresh" onclick="refreshGameData()">↻ Refresh</button>
            <button class="footer-btn btn-auto" id="autoPlayToggleBtn" onclick="toggleAutoPlay()">Automatic</button>
        </div>
    </div>

    <!-- Win Modal Popup -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2 style="color: var(--success); margin-top:0;">BINGO! (ቢንጎ!)</h2>
            <p id="winModalText" style="font-weight: bold; color: var(--primary-dark);"></p>
            <button class="submit-btn" onclick="closeWinModal()">እሺ (OK)</button>
        </div>
    </div>

    <script>
        let userContactData = "";
        let calledNumbersList = [];
        let autoPlayInterval = null;
        let isAutoRunning = false;

        // Telegram WebApp integration support check
        let tg = window.Telegram?.WebApp;
        if(tg) {
            tg.expand();
        }

        function shareTelegramContact() {
            if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                let user = tg.initDataUnsafe.user;
                userContactData = user.first_name + " (" + (user.username ? "@"+user.username : user.id) + ")";
                alert("✅ ቴሌግራም መረጃዎ ተካቷል: " + userContactData);
                startGameSession();
            } else {
                // Fallback simulation if not inside official Telegram container
                let phoneSim = prompt("ስልክ ቁጥርዎን ወይም የቴሌግራም መለያዎን ያስገቡ፡", "0912345678");
                if(phoneSim) {
                    userContactData = phoneSim;
                    startGameSession();
                }
            }
        }

        function completeRegistration() {
            let phone = document.getElementById("userPhoneInput").value;
            if(!phone || phone.length < 9) {
                alert("እባክዎ ትክክለኛ ስልክ ቁጥር ያስገቡ!");
                return;
            }
            userContactData = phone;
            startGameSession();
        }

        function startGameSession() {
            document.getElementById("regView").style.display = "none";
            document.getElementById("gameView").style.display = "flex";
            buildBoardSidebar();
            startAutoCallingProcess();
        }

        // Build 1-75 columns grid on the left
        function buildBoardSidebar() {
            let container = document.getElementById("bColumnsContainer");
            container.innerHTML = "";
            let letters = ['B', 'I', 'N', 'G', 'O'];
            
            for(let col = 0; col < 5; col++) {
                let colDiv = document.createElement("div");
                colDiv.classList.add("col-group");
                
                let header = document.createElement("div");
                header.classList.add("col-header");
                header.innerText = letters[col];
                colDiv.appendChild(header);

                let startNum = col * 15 + 1;
                let endNum = startNum + 14;

                for(let n = startNum; n <= endNum; n++) {
                    let cell = document.createElement("button");
                    cell.classList.add("num-cell");
                    cell.innerText = n;
                    cell.id = `num-cell-${n}`;
                    colDiv.appendChild(cell);
                }
                container.appendChild(colDiv);
            }
        }

        // Amharic Text to Speech Function
        function speakAmharic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'am-ET';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startAutoCallingProcess() {
            if(autoPlayInterval) clearInterval(autoPlayInterval);
            isAutoRunning = true;
            document.getElementById("autoPlayToggleBtn").style.background = "#e67e22";
            document.getElementById("autoPlayToggleBtn").innerText = "Pause";
            
            speakAmharic("ጨዋታው ተጀምሯል፣ መልካም እድል!");

            autoPlayInterval = setInterval(() => {
                if(calledNumbersList.length >= 75) {
                    clearInterval(autoPlayInterval);
                    return;
                }
                let num;
                do {
                    num = Math.floor(Math.random() * 75) + 1;
                } while(calledNumbersList.includes(num));

                calledNumbersList.push(num);
                updateGameUIWithNumber(num);
            }, 3500);
        }

        function updateGameUIWithNumber(num) {
            // Determine column letter & class
            let letterPrefix = 'b';
            if(num >= 1 && num <= 15) { letterPrefix = 'b'; }
            else if(num >= 16 && num <= 30) { letterPrefix = 'i'; }
            else if(num >= 31 && num <= 45) { letterPrefix = 'n'; }
            else if(num >= 46 && num <= 60) { letterPrefix = 'g'; }
            else if(num >= 61 && num <= 75) { letterPrefix = 'o'; }

            let cellLabel = `${letterPrefix.toUpperCase()}-${num}`;
            
            // Update big center circle
            document.getElementById("currentCallCircle").innerText = cellLabel;
            
            // Highlight left board cell
            let cell = document.getElementById(`num-cell-${num}`);
            if(cell) {
                cell.className = `num-cell called-${letterPrefix}`;
            }

            // Update top called counter
            document.getElementById("lblCalledCount").innerText = calledNumbersList.length;

            // Update recent calls history row
            let recentContainer = document.getElementById("recentCallsRow");
            recentContainer.innerHTML = "";
            let lastThree = calledNumbersList.slice(-3).reverse();
            lastThree.forEach(val => {
                let ball = document.createElement("div");
                ball.classList.add("recent-ball");
                ball.innerText = val;
                recentContainer.appendChild(ball);
            });

            // Speak number in Amharic
            speakAmharic(`ቁጥር ${num}`);

            // Simulated win condition at call 10
            if(calledNumbersList.length === 10) {
                document.getElementById("winModalText").innerText = `እንኳን ደስ አሎት! ተጫዋች ${userContactData} አሸንፈዋል!`;
                document.getElementById("winModal").style.display = "flex";
                speakAmharic("ቢንጎ! አሸናፊ ተገኝቷል!");
                toggleAutoPlay();
            }
        }

        function toggleAutoPlay() {
            if(isAutoRunning) {
                clearInterval(autoPlayInterval);
                isAutoRunning = false;
                document.getElementById("autoPlayToggleBtn").style.background = "var(--success)";
                document.getElementById("autoPlayToggleBtn").innerText = "Automatic";
            } else {
                startAutoCallingProcess();
            }
        }

        function refreshGameData() {
            alert("⚠️ የጨዋታው መረጃዎች ታድሰዋል!");
        }

        function leaveGame() {
            if(autoPlayInterval) clearInterval(autoPlayInterval);
            if('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById("gameView").style.display = "none";
            document.getElementById("regView").style.display = "flex";
            calledNumbersList = [];
        }

        function closeWinModal() {
            document.getElementById("winModal").style.display = "none";
        }
    </script>
</body>
</html>
