<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቴሌግራም ቢንጎ</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #ffffff; text-align: center; padding: 15px; margin: 0; }
        h3 { color: #4CAF50; margin-top: 10px; margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 340px; margin: 20px auto; }
        .cell { aspect-ratio: 1; background: #1e1e1e; border: 2px solid #333333; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; user-select: none; transition: all 0.2s ease; }
        .cell.marked { background: #2481cc; border-color: #2481cc; transform: scale(0.95); }
        .cell.free { background: #ff9800; border-color: #ff9800; font-size: 0.9rem; }
        button { background: #4CAF50; color: #fff; padding: 15px 0; border: none; font-size: 1.1rem; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; max-width: 340px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h3>🎰 የእርስዎ ቢንጎ ካርድ 🎰</h3>
    <p style="color: #aaa; font-size: 0.9rem; margin-top: 0;">በዕጣ የሚወጡትን ቁጥሮች እየነኩ ያጥቁሩ</p>
    <div class="grid" id="board"></div>
    <button onclick="submitClaim()">🏆 ቢንጎ ብያለሁ! (አረጋግጥ)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');

        let cardMatrix = [];
        let markedStates = new Array(25).fill(false);
        markedStates[12] = true; // የመሃል ነጻ ቦታ (FREE) ሁልጊዜ የተመረጠ ነው

        function createBoard() {
            const ranges = [
                {min: 1, max: 15},  // B
                {min: 16, max: 30}, // I
                {min: 31, max: 45}, // N
                {min: 46, max: 60}, // G
                {min: 61, max: 75}  // O
            ];
            let columnPools = [];
            
            for(let i=0; i<5; i++){
                let set = [];
                for(let v=ranges[i].min; v<=ranges[i].max; v++) set.push(v);
                set.sort(()=> Math.random() - 0.5);
                columnPools.push(set.slice(0,5));
            }

            for(let r=0; r<5; r++){
                let row = [];
                for(let c=0; c<5; c++) row.push(columnPools[c][r]);
                cardMatrix.push(row);
            }

            const container = document.getElementById('board');
            for(let r=0; r<5; r++){
                for(let c=0; c<5; c++){
                    const cellIdx = r * 5 + c;
                    const block = document.createElement('div');
                    block.className = 'cell';
                    
                    if(r===2 && c===2){
                        block.innerText = "ነጻ";
                        block.classList.add('marked', 'free');
                    } else {
                        block.innerText = cardMatrix[r][c];
                        block.onclick = () => {
                            block.classList.toggle('marked');
                            markedStates[cellIdx] = !markedStates[cellIdx];
                        };
                    }
                    container.appendChild(block);
                }
            }
        }

        async function submitClaim() {
            if(!chatId) return alert("ስህተት: የግሩፕ መታወቂያ (Chat ID) አልተገኘም።");

            const payload = {
                chatId: chatId,
                cardMatrix: cardMatrix,
                markedCells: markedStates,
                userId: tg.initDataUnsafe?.user?.id || "ያልታወቀ",
                username: tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "ተጫዋች"
            };

            // የጀርባ አቅራቢ ሰርቨርህን አድራሻ እዚህ ጋ ይተካል
            const response = await fetch('https://your-backend-api-url.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const resData = await response.json();
            if(resData.success) {
                tg.close();
            } else {
                alert(resData.message);
            }
        }

        createBoard();
    </script>
</body>
</html>
