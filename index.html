<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nunu Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #8c61a5;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0,0,0,0.15);
        }
        .btn-top {
            background: #6c3483;
            color: #fff;
            border: 1px solid #d7bde2;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .called-number-display {
            background: #f39c12;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            padding: 4px 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stake-box {
            background: #6c3483;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            border: 1px solid #d7bde2;
        }
        .sub-header {
            padding: 6px 15px;
            font-size: 13px;
            color: #d7bde2;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .main-content {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }
        /* የካርቴላዎች መረጫ ግሪድ */
        .board-selector {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            max-height: 60vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
        }
        .board-num-btn {
            background: #e0d0ec;
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #333;
        }
        .board-num-btn:active {
            background: #f39c12;
            color: white;
        }

        /* የቢንጎ ካርድ እይታ */
        .bingo-card-container {
            background: #f4ecf7;
            color: #333;
            width: 100%;
            max-width: 350px;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            gap: 4px;
            margin-bottom: 4px;
        }
        .b-head { background: #d98880; color: white; text-align: center; font-weight: bold; padding: 6px 0; border-radius: 4px; }
        .b-head:nth-child(2) { background: #27ae60; }
        .b-head:nth-child(3) { background: #2980b9; }
        .b-head:nth-child(4) { background: #c0392b; }
        .b-head:nth-child(5) { background: #8e44ad; }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            width: 100%;
        }
        .bingo-cell {
            background: #fff;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            user-select: none;
        }
        .bingo-cell.marked {
            background-color: #f39c12 !important;
            color: white !important;
            border-color: #d68910 !important;
        }

        /* ውርርድ መምረጫ (Stake Modal / Options) */
        .stake-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .stake-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .stake-btn.active {
            background: #f39c12;
            border: 2px solid #fff;
        }

        /* የታችኛው ናቪጌሽን ባር */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #5b326f;
            padding: 8px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item {
            background: none;
            border: none;
            color: #d7bde2;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .nav-item.active {
            color: #fff;
            font-weight: bold;
        }
        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* የድል ማሳወቂያ ሞዳል */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #f39c12;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .action-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-top" onclick="resetToSelection()">Leave</button>
        <div id="called-box" class="called-number-display">-</div>
        <button class="btn-top" id="draw-btn" onclick="toggleAutoDraw()">Draw</button>
    </div>
    
    <div class="sub-header">
        <span id="sub-title">ካርቴላ ይምረጡ</span>
        <div class="stake-box">Stake: <span id="current-stake">10</span> ብር</div>
    </div>

    <div class="main-content" id="mainArea">
        <!-- የውርርድ መጠን ምርጫ -->
        <div class="stake-selector" id="stakeSelectorArea">
            <button class="stake-btn active" onclick="setStake(10)">10 ብር ጫወት</button>
            <button class="stake-btn" onclick="setStake(20)">20 ብር ጫወት</button>
        </div>

        <!-- የ 400 ካርቴላዎች መረጫ -->
        <div class="board-selector" id="boardSelector"></div>

        <!-- የቢንጎ ካርድ ማሳያ -->
        <div class="bingo-card-container" id="cardContainer">
            <h3 style="margin: 0 0 8px 0; color: #5b326f;" id="card-title-lbl">Board Number 1</h3>
            <div class="bingo-header-row">
                <div class="b-head">B</div>
                <div class="b-head">I</div>
                <div class="b-head">N</div>
                <div class="b-head">G</div>
                <div class="b-head">O</div>
            </div>
            <div class="bingo-grid" id="bingoGrid"></div>
            <button class="action-btn" onclick="manualCheckBingo()">BINGO! አረጋግጥ</button>
        </div>
    </div>

    <!-- የተስተካከለ የታችኛው ሜኑ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('game')"><span class="icon">🎮</span> Game</button>
        <button class="nav-item" onclick="switchTab('history')"><span class="icon">📜</span> History</button>
        <button class="nav-item" onclick="switchTab('wallet')"><span class="icon">👛</span> Wallet</button>
        <button class="nav-item" onclick="switchTab('profile')"><span class="icon">👤</span> Profile</button>
    </div>

    <!-- የድል ማሳወቂያ ሞዳል -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2 style="margin-top:0;">🎉 BINGO! BINGO! 🎉</h2>
            <p id="winner-text" style="font-size: 16px; font-weight: bold; line-height: 1.5;"></p>
            <button class="action-btn" style="background:#fff; color:#f39c12;" onclick="closeModal()">ቀጥል</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let userName = "Nunu";
        let userWallet = 100; // የኪስ ቦርሳ ቀሪ ሂሳብ
        let currentStake = 10;

        let calledNumbers = [];
        let autoDrawInterval = null;
        let selectedBoardId = null;
        let currentBoardNumbers = [];
        let isDrawing = false;

        // የ 400 ካርቴላዎችን ማመንጨት
        const selector = document.getElementById("boardSelector");
        for(let i = 1; i <= 400; i++) {
            let btn = document.createElement("button");
            btn.classList.add("board-num-btn");
            btn.innerText = i;
            btn.onclick = () => selectBoard(i);
            selector.appendChild(btn);
        }

        function setStake(amount) {
            currentStake = amount;
            document.getElementById("current-stake").innerText = amount;
            document.querySelectorAll('.stake-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function playSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function selectBoard(id) {
            if(userWallet < currentStake) {
                alert("⚠️ የኪስ ቦርሳዎ ሂሳብ በቂ አይደለም! እባክዎ ኪስ ቦርሳዎን ይሙሉ አሉ።");
                return;
            }
            userWallet -= currentStake;

            selectedBoardId = id;
            document.getElementById("boardSelector").style.display = "none";
            document.getElementById("stakeSelectorArea").style.display = "none";
            document.getElementById("cardContainer").style.display = "flex";
            document.getElementById("sub-title").innerText = `ተጫዋች: ${userName} (Board #${id})`;
            document.getElementById("card-title-lbl").innerText = `Board Number ${id}`;
            
            currentBoardNumbers = generateStandardBingoCard(id);
            renderBingoCard();
            startAutoDraw();
        }

        function resetToSelection() {
            stopAutoDraw();
            document.getElementById("boardSelector").style.display = "grid";
            document.getElementById("stakeSelectorArea").style.display = "flex";
            document.getElementById("cardContainer").style.display = "none";
            document.getElementById("sub-title").innerText = "ካርቴላ ይምረጡ";
            calledNumbers = [];
            document.getElementById("called-box").innerText = "-";
        }

        // ትክክለኛ የቢንጎ ክልል ቁጥሮች አሰራር (B:1-15, I:16-30, N:31-45, G:46-60, O:61-75)
        function generateStandardBingoCard(seed) {
            let card = [];
            let rGen = seedRandom(seed);
            
            let cols = [
                range(1, 15),   // B
                range(16, 30),  // I
                range(31, 45),  // N
                range(46, 60),  // G
                range(61, 75)   // O
            ];

            let colNums = cols.map(col => shuffle(col, rGen).slice(0, 5));

            // በ 5x5 ግሪድ መልክ ማቀናጀት
            for(let r = 0; r < 5; r++) {
                for(let c = 0; c < 5; c++) {
                    if(r === 2 && c === 2) {
                        card.push("*"); // ማዕከላዊ ነፃ ቦታ
                    } else {
                        card.push(colNums[c][r]);
                    }
                }
            }
            return card;
        }

        function range(min, max) {
            let arr = [];
            for(let i = min; i <= max; i++) arr.push(i);
            return arr;
        }

        function shuffle(array, rGen) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(rGen() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function seedRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return function() {
                x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            };
        }

        function renderBingoCard() {
            let grid = document.getElementById("bingoGrid");
            grid.innerHTML = "";
            currentBoardNumbers.forEach((num, idx) => {
                let cell = document.createElement("div");
                cell.classList.add("bingo-cell");
                cell.innerText = num;

                if(idx === 12) {
                    cell.classList.add("marked");
                }

                cell.onclick = () => {
                    if(idx !== 12) {
                        cell.classList.toggle("marked");
                        checkAutoWin(); // ተጫዋቹ ቁጥር ሲነካ መስመር መዘጋቱን በራሱ ይፈትሻል
                    }
                };
                grid.appendChild(cell);
            });
        }

        // በየሰከንዱ (በየ 3 ሰከንድ) በራሱ ቁጥር መጥሪያ
        function startAutoDraw() {
            if(autoDrawInterval) clearInterval(autoDrawInterval);
            isDrawing = true;
            document.getElementById("draw-btn").innerText = "Pause";

            autoDrawInterval = setInterval(() => {
                if(calledNumbers.length >= 75) {
                    stopAutoDraw();
                    return;
                }
                let num;
                do {
                    num = Math.floor(Math.random() * 75) + 1;
                } while(calledNumbers.includes(num));

                calledNumbers.push(num);
                document.getElementById("called-box").innerText = num;
                playSound();

                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
                checkAutoWin();
            }, 3000); // በየ 3 ሰከንዱ አንዱ ቁጥር ይጠራጃል
        }

        function stopAutoDraw() {
            clearInterval(autoDrawInterval);
            autoDrawInterval = null;
            isDrawing = false;
            document.getElementById("draw-btn").innerText = "Draw";
        }

        function toggleAutoDraw() {
            if(isDrawing) {
                stopAutoDraw();
            } else {
                startAutoDraw();
            }
        }

        // የአንድ መስመር መዘጋት ማረጋገጫ (አግድም፣ አቀባዊ፣ ሰያፍ)
        function checkAutoWin(isManual = false) {
            let cells = document.querySelectorAll(".bingo-cell");
            let markedMatrix = [];
            for(let i = 0; i < 25; i++) {
                markedMatrix.push(cells[i].classList.contains("marked"));
            }

            let hasWon = false;

            // አግድም መስመሮች (Rows)
            for(let r = 0; r < 5; r++) {
                if(markedMatrix[r*5] && markedMatrix[r*5+1] && markedMatrix[r*5+2] && markedMatrix[r*5+3] && markedMatrix[r*5+4]) hasWon = true;
            }
            // አቀባዊ መስመሮች (Cols)
            for(let c = 0; c < 5; c++) {
                if(markedMatrix[c] && markedMatrix[c+5] && markedMatrix[c+10] && markedMatrix[c+15] && markedMatrix[c+20]) hasWon = true;
            }
            // ሰያፍ (Diagonals)
            if(markedMatrix[0] && markedMatrix[6] && markedMatrix[12] && markedMatrix[18] && markedMatrix[24]) hasWon = true;
            if(markedMatrix[4] && markedMatrix[8] && markedMatrix[12] && markedMatrix[16] && markedMatrix[20]) hasWon = true;

            if(hasWon) {
                stopAutoDraw();
                // ብዙ ሰዎች ሊያሸንፉ ስለሚችሉ ሽልማቱ ይከፈላል (ለምሳሌ 2 አሸናፊዎች ቢኖሩ ግማሽ በግማሽ)
                let totalPool = currentStake * 2; 
                let winnersCount = Math.random() < 0.3 ? 2 : 1; // አልፎ አልፎ ሁለት አሸናፊዎች መምጣታቸውን ማሳየት
                let prizePerWinner = (totalPool / winnersCount).toFixed(0);

                let winMsg = winnersCount > 1 
                    ? `በዚህ ጨዋታ ${winnersCount} ሰዎች መስመር ዘግተዋል! ሽልማቱ (ብር ${totalPool}) በእኩል ተካፍለዋል:\n\n🏆 ${userName} አሸንፈዋል! የደረሰዎት ድርሻ: ${prizePerWinner} ብር`
                    : `🏆 ${userName} መስመር በመዝጋት ጨዋታውን አሸንፈዋል!\n\nየተሸለሙት ጠቅላላ ገንዘብ: ${prizePerWinner} ብር`;

                userWallet += parseInt(prizePerWinner);
                document.getElementById("winner-text".innerText = winMsg);
                document.getElementById("winModal").style.display = "flex";
            } else if(isManual) {
                alert("⚠️ ገና ሙሉ መስመር አልተዘጋም! እባክዎ ተጨማሪ ቁጥሮች ይጠብቁ ወይም ምልክቶቹን ያረጋግጡ።");
            }
        }

        function manualCheckBingo() {
            checkAutoWin(true);
        }

        function closeModal() {
            document.getElementById("winModal").style.display = "none";
            resetToSelection();
        }

        // የታችኛው ሜኑ ማስተላለፊያ
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if(tab === 'wallet') {
                alert(`👛 የኪስ ቦርሳ ቀሪ ሂሳብዎ: ${userWallet} ብር`);
            } else if(tab === 'history') {
                alert("📜 የጨዋታ ታሪክዎ ባዶ ነው።");
            } else if(tab === 'profile') {
                alert(`👤 ተጠቃሚ: ${userName}\nሪፈራል ኮድ: NUNU777`);
            }
        }
    </script>
</body>
</html>
