<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afro Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #dcd0ec;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* ሐምራዊው የርዕስ ሳጥን */
        .welcome-banner {
            background: linear-gradient(135deg, #6c3483, #4a235a);
            color: #fff;
            margin: 15px;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }
        .welcome-banner h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }
        .welcome-banner p {
            margin: 5px 0 0 0;
            font-size: 26px;
            font-weight: 700;
        }
        
        /* የቦርድ ብዛት አዶ */
        .boards-badge-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .boards-badge {
            background: #6c3483;
            color: white;
            padding: 6px 18px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* የውርርድ ሳጥን (Choose Your Stake) */
        .stake-card {
            background: #f4ecf7;
            border: 2px solid #a569bd;
            margin: 0 15px 15px 15px;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stake-title {
            color: #4a235a;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .stake-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 340px;
            background: #45b39d;
            border-radius: 35px;
            padding: 6px 8px 6px 20px;
            margin-bottom: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .stake-row.orange {
            background: #eb984e;
        }
        .stake-btn-action {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .stake-amount {
            color: white;
            font-size: 28px;
            font-weight: 800;
            padding-right: 20px;
        }

        /* የጨዋታ ውስጥ የላይኛው ባር */
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4ecf7;
            padding: 10px 12px;
            border-bottom: 2px solid #d7bde2;
        }
        .top-btn {
            background: #6c3483;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .top-box {
            background: white;
            color: #333;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            min-width: 45px;
        }
        .top-box.highlight {
            background: #f39c12;
            color: white;
            font-size: 22px;
            border: none;
        }

        /* የቦርዶች ምርጫ ገጽ (Grid) */
        .board-selection-area {
            flex: 1;
            padding: 10px 15px;
            overflow-y: auto;
            display: none;
        }
        .board-header-info {
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .boards-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            background: #f4ecf7;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #a569bd;
        }
        .b-num-btn {
            background: #bdc3c7;
            border: none;
            aspect-ratio: 1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: #2c3e50;
        }
        .b-num-btn.selected {
            background: #e67e22;
            color: white;
        }

        /* የታችኛው ናቪጌሽን ባር */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #4a235a;
            padding: 8px 0;
            margin-top: auto;
        }
        .nav-item {
            background: none;
            border: none;
            color: #d7bde2;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .nav-item.active {
            color: #fff;
            background: #6c3483;
            padding: 6px 15px;
            border-radius: 12px;
            font-weight: bold;
        }
        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* የድል ማሳወቂያ ፖፕ-አፕ (Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #f4ecf7;
            width: 85%;
            max-width: 340px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .modal-header-bg {
            background: #e67e22;
            color: white;
            padding: 20px;
        }
        .modal-header-bg h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
        }
        .winner-badge {
            background: #27ae60;
            color: white;
            display: inline-block;
            padding: 6px 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }
        .winning-card-preview {
            padding: 15px;
        }
    </style>
</head>
<body>

    <!-- መነሻ ገጽ (Home / Welcome View) -->
    <div id="homeView" style="display: flex; flex-direction: column; flex: 1;">
        <div class="welcome-banner">
            <h1>Welcome</h1>
            <p>to</p>
            <h1>Afro Bingo</h1>
        </div>

        <div class="boards-badge-container">
            <div class="boards-badge">🎟️ 0</div>
        </div>

        <div class="stake-card">
            <div class="stake-title">Choose Your Stake</div>
            
            <div class="stake-row">
                <button class="stake-btn-action" onclick="startWithStake(10)">Play</button>
                <div class="stake-amount">10</div>
            </div>

            <div class="stake-row orange">
                <button class="stake-btn-action" onclick="startWithStake(20)">Play</button>
                <div class="stake-amount">20</div>
            </div>
        </div>
    </div>

    <!-- የቦርድ መምረጫ / ጨዋታ ውስጥ ገጽ -->
    <div id="gameView" class="board-selection-area">
        <div class="game-top-bar" style="margin: -10px -15px 10px -15px; border-radius: 0;">
            <button class="top-btn" onclick="backToHome()">Leave</button>
            <div class="top-box highlight" id="calledNumDisplay">29</div>
            <div class="top-box" id="walletDisplay">Wallet 0</div>
            <div class="top-box" id="stakeDisplay">Stake 10</div>
            <button class="top-btn" onclick="triggerRefresh()">Refresh</button>
        </div>

        <div class="board-header-info">Boards: 0/2</div>

        <div class="boards-grid" id="boardsGridContainer">
            <!-- በጃቫስክሪፕት ከ 1 እስከ 90 የሚሞሉ ቁጥሮች -->
        </div>
    </div>

    <!-- የታችኛው ሜኑ አሞሌ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('game')"><span class="icon">🎮</span> Game</button>
        <button class="nav-item" onclick="switchTab('history')"><span class="icon">📜</span> History</button>
        <button class="nav-item" onclick="switchTab('wallet')"><span class="icon">👛</span> Wallet</button>
        <button class="nav-item" onclick="switchTab('profile')"><span class="icon">👤</span> Profile</button>
    </div>

    <!-- የድል ማሳወቂያ ሞዳል (Popup) -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <div class="modal-header-bg">
                <h2>BINGO!</h2>
                <div class="winner-badge">Tigistu has won the game.</div>
            </div>
            <div class="winning-card-preview">
                <p style="margin: 10px 0; font-weight: bold; color: #4a235a;">ጨዋታው ተጠናቋል!</p>
                <button class="top-btn" style="width: 100%; background: #e67e22; padding: 12px; font-size: 16px;" onclick="closeModal()">ቀጥል</button>
            </div>
        </div>
    </div>

    <script>
        let currentStake = 10;

        // ከ 1 እስከ 90 ያሉትን የቦርድ ቁጥሮች መፍጠር
        const gridContainer = document.getElementById("boardsGridContainer");
        for(let i = 1; i <= 90; i++) {
            let btn = document.createElement("button");
            btn.classList.add("b-num-btn");
            btn.innerText = i;
            btn.onclick = () => {
                btn.classList.toggle("selected");
            };
            gridContainer.appendChild(btn);
        }

        function startWithStake(amount) {
            currentStake = amount;
            document.getElementById("homeView").style.display = "none";
            document.getElementById("gameView").style.display = "block";
            document.getElementById("stakeDisplay").innerText = `Stake ${amount}`;
            
            // ለሙከራ ያህል አሸናፊ ፖፕ-አፕ በራሱ እንዲመጣ ማድረግ ይቻላል (ወይም በሰከንድ የሚጠራ ቁጥር)
            setTimeout(() => {
                document.getElementById("winModal").style.display = "flex";
            }, 5000);
        }

        function backToHome() {
            document.getElementById("gameView").style.display = "none";
            document.getElementById("homeView").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("winModal").style.display = "none";
            backToHome();
        }

        function triggerRefresh() {
            alert("ቦርዶች ታድሰዋል!");
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if(tab === 'wallet') {
                alert("የኪስ ቦርሳ ገጽ");
            } else if(tab === 'history') {
                alert("የታሪክ ገጽ");
            } else if(tab === 'profile') {
                alert("የመገለጫ ገጽ");
            }
        }
    </script>
</body>
</html>
